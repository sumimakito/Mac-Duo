name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-duo-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      APP_PATH: build/Mac Duo.app
      DIST_PATH: build/release

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Compute version metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          BUILD_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          LABEL="${VERSION}-dev.${BUILD_VERSION}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::CFBundleShortVersionString must contain three numeric components"
            exit 1
          }
          {
            echo "version=$VERSION"
            echo "build=$BUILD_VERSION"
            echo "label=$LABEL"
            echo "title=Mac Duo $LABEL"
            echo "dmg=Mac-Duo-dev.dmg"
            echo "zip=Mac-Duo-dev.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
            APPLE_NOTARY_KEY_P8_BASE64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            [[ -n "${!name}" ]] || { echo "::error::Missing secret: $name"; exit 1; }
          done

      - name: Build universal app
        run: |
          set -euo pipefail
          SIGN_IDENTITY=- ./build.sh --universal
          lipo "$APP_PATH/Contents/MacOS/MacDuo" -verify_arch arm64 x86_64

      - name: Install Developer ID credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          {
            echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode -o "$NOTARY_KEY_PATH"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk \
            -v team="$APPLE_TEAM_ID" \
            '/Developer ID Application:/ && index($0, "(" team ")") { print $2 }')"
          [[ "$IDENTITIES" =~ ^[A-Fa-f0-9]{40}$ ]] || {
            echo "::error::Expected exactly one valid Developer ID Application identity for the configured team"
            exit 1
          }
          echo "::add-mask::$IDENTITIES"
          echo "SIGNING_IDENTITY=$IDENTITIES" >> "$GITHUB_ENV"

      - name: Sign release app
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_VERSION: ${{ steps.meta.outputs.build }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_VERSION" "$APP_PATH/Contents/Info.plist"
          codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" \
            --timestamp --options runtime "$APP_PATH"
          codesign --verify --strict --all-architectures "$APP_PATH"
          INFO="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)"
          TEAM="$(printf '%s\n' "$INFO" | awk -F= '/^TeamIdentifier=/{print $2}')"
          [[ "$TEAM" == "$APPLE_TEAM_ID" ]] || { echo "::error::Unexpected signing team"; exit 1; }
          printf '%s\n' "$INFO" | grep -q '^Authority=Developer ID Application:'
          printf '%s\n' "$INFO" | grep -q '^Timestamp='
          printf '%s\n' "$INFO" | grep -q 'flags=.*runtime'

      - name: Package signed DMG
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg }}
        run: |
          set -euo pipefail
          mkdir -p "$DIST_PATH"
          STAGING="$(mktemp -d "$RUNNER_TEMP/dmg-staging.XXXXXX")"
          trap 'rm -rf "$STAGING"' EXIT
          ditto "$APP_PATH" "$STAGING/Mac Duo.app"
          ln -s /Applications "$STAGING/Applications"
          DMG_PATH="$DIST_PATH/$DMG_NAME"
          hdiutil create -volname 'Mac Duo' -srcfolder "$STAGING" \
            -fs HFS+ -format UDZO "$DMG_PATH"
          codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp "$DMG_PATH"
          codesign --verify --strict "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize DMG
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          SUBMISSION_JSON="$RUNNER_TEMP/notary-submission.json"
          NOTARY_LOG="$RUNNER_TEMP/notary-log.json"
          SUBMIT_EXIT=0
          xcrun notarytool submit "$DMG_PATH" \
            --key "$NOTARY_KEY_PATH" --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$SUBMISSION_JSON" || SUBMIT_EXIT=$?
          SUBMISSION_ID="$(plutil -extract id raw -o - "$SUBMISSION_JSON" 2>/dev/null || true)"
          STATUS="$(plutil -extract status raw -o - "$SUBMISSION_JSON" 2>/dev/null || true)"
          if [[ "$SUBMIT_EXIT" -ne 0 || "$STATUS" != Accepted ]]; then
            if [[ -n "$SUBMISSION_ID" ]]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$NOTARY_KEY_PATH" --key-id "$APPLE_NOTARY_KEY_ID" \
                --issuer "$APPLE_NOTARY_ISSUER_ID" "$NOTARY_LOG" || true
            fi
            echo "::error::Notarization did not return Accepted (exit $SUBMIT_EXIT, status $STATUS)"
            exit 1
          fi

      - name: Staple tickets and package ZIP
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zip }}
        run: |
          set -euo pipefail
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --strict "$DMG_PATH"
          # The ZIP needs the app's own ticket for offline installation.
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --strict --all-architectures "$APP_PATH"
          ZIP_PATH="$DIST_PATH/$ZIP_NAME"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Remove signing credentials
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CLEANUP_STATUS=0
          if [[ -e "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || CLEANUP_STATUS=$?
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
          exit "$CLEANUP_STATUS"

      - name: Upload notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notary-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Duo-${{ steps.meta.outputs.label }}
          path: |
            build/release/*.dmg
            build/release/*.zip
          if-no-files-found: error

      - name: Write release notes
        env:
          BUILD_LABEL: ${{ steps.meta.outputs.label }}
        run: |
          set -euo pipefail
          {
            printf '**Mac Duo %s**\n\n' "$BUILD_LABEL"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Open the DMG and drag **Mac Duo** to **Applications**, or extract the ZIP.\n\n'
            printf 'Requires macOS 14 or later and a MacBook with a compatible lid angle sensor.\n'
            printf 'Includes Apple Silicon and Intel binaries.\n\n'
            printf 'Grant Screen Recording permission when prompted to enable the effect.\n'
          } > "$DIST_PATH/NOTES.md"

      - name: Publish development build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [[ "$MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main. This build remains available in Actions artifacts."
            exit 0
          fi
          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --cleanup-tag --yes
          fi
          gh release create dev "$DMG_PATH" "$ZIP_PATH" \
            --target "$GITHUB_SHA" --title "$RELEASE_TITLE" \
            --prerelease --latest=false --notes-file "$DIST_PATH/NOTES.md"
